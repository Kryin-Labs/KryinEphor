name: Security gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      TEST_SUPABASE_URL: ${{ secrets.TEST_SUPABASE_URL || secrets.VITE_SUPABASE_URL }}
      TEST_SUPABASE_ANON_KEY: ${{ secrets.TEST_SUPABASE_ANON_KEY || secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install deps
        run: npm i --no-audit --no-fund @supabase/supabase-js
      - name: RLS smoke tests (anon)
        run: node scripts/test-rls.mjs
      - name: Unit and capability regression tests
        run: node --test tests/*.test.mjs
      - name: Supabase linter gate
        if: env.SUPABASE_ACCESS_TOKEN != ''
        run: node scripts/security-scan-ci.mjs
